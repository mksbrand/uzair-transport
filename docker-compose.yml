version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: uzair_transport_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uzair_transport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uzair_transport_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/uzair_transport?schema=public
      JWT_SECRET: uzair_transport_jwt_super_secret_key_2026
      NEXTAUTH_SECRET: uzair_transport_nextauth_secret_key_2026
      API_PORT: 3001
      API_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uzair_transport_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: Uzair Transport
    depends_on:
      - backend

volumes:
  postgres_data:
